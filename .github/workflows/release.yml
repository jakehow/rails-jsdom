name: Release

on:
  push:
    tags: [ "v*" ]

jobs:
  release:
    runs-on: ubuntu-latest
    environment: rubygems
    permissions:
      contents: read
      id-token: write
    env:
      RUBYGEMS_OWNER: "31076"
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install npm packages
        run: npm ci

      - name: Test
        run: bundle exec rake test

      - name: Check the tag matches the gem version
        run: test "${GITHUB_REF_NAME}" = "v$(ruby -Ilib -e 'require "rails_jsdom/version"; print RailsJsdom::VERSION')"

      - name: Publish to RubyGems with trusted publishing
        run: |
          jwt=$(curl -sSf -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=rubygems.org" | jq -r .value)
          GEM_HOST_API_KEY=$(curl -sSf -X POST https://rubygems.org/api/v1/oidc/trusted_publisher/exchange_token \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg jwt "$jwt" --arg owner "$RUBYGEMS_OWNER" '{jwt: $jwt, owner: $owner}')" | jq -r .rubygems_api_key)
          echo "::add-mask::${GEM_HOST_API_KEY}"
          export GEM_HOST_API_KEY
          gem build rails-jsdom.gemspec
          gem push "rails-jsdom-${GITHUB_REF_NAME#v}.gem"
